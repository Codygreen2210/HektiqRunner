name: Live test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test --silent
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node scripts/live-test.js
      - name: Save results to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/live-test.md
          git commit -m "Live test results" || echo "no changes"
          git push
